# CI for supply-chain-data-platform.
# Activates by moving this file to .github/workflows/ci.yml.
# (Kept under docs/ because the publishing GitHub App lacks the
# Workflows permission needed to create .github/workflows/.)
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -q
